name: siatrab
description: "SIATRAB - Sistema de Apoio ao Trabalhador para cálculos e dúvidas trabalhistas."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # State Management & Navigation
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.2

  # Utils
  intl: ^0.20.2

  # Firebase (APENAS UMA VEZ cada)
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0

  # PDF e Compartilhamento
  pdf: ^3.10.8
  printing: ^5.11.1
  share_plus: ^10.1.0

  # Markdown
  flutter_markdown: ^0.7.3+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
